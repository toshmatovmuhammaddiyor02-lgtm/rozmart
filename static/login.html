<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ROZMART — вход в панель</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/static/icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/static/icons/favicon-192.png">
<link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:#EDEDED;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  color:#111;font-size:14px;padding:20px}
.box{background:#fff;border-radius:14px;box-shadow:0 12px 36px rgba(0,0,0,.14);
  padding:30px 28px;width:100%;max-width:360px}
.lg{font-size:21px;font-weight:700;color:#E30613;letter-spacing:.4px;text-align:center}
.sb{font-size:12px;color:#8A8A8A;text-align:center;margin:4px 0 22px}
label{display:block;font-size:12px;color:#8A8A8A;margin:0 0 5px}
input{font:inherit;width:100%;padding:10px 12px;border:1px solid #DDD;border-radius:8px;margin-bottom:14px}
button{width:100%;padding:11px;border:none;border-radius:8px;background:#E30613;color:#fff;
  font-size:14px;cursor:pointer}
button:disabled{background:#DDD;color:#999;cursor:not-allowed}
.msg{background:#FFEBEE;color:#B3050F;padding:10px 12px;border-radius:8px;margin-bottom:14px;
  font-size:13px;display:none}
.msg.on{display:block}
.note{font-size:12px;color:#8A8A8A;margin-top:16px;text-align:center;line-height:1.5}
</style>
</head>
<body>
<form class="box" id="form">
  <div class="lg">ROZMART</div>
  <div class="sb">вход в панель администратора</div>
  <div class="msg" id="msg"></div>
  <label for="u">Логин</label>
  <input id="u" name="username" autocomplete="username" autocapitalize="off" autofocus required>
  <label for="p">Пароль</label>
  <input id="p" name="password" type="password" autocomplete="current-password" required>
  <button id="go" type="submit">Войти</button>
  <div class="note">Администратор может войти и через Telegram —
    кнопкой «Панель» в приложении магазина.</div>
</form>
<script>
(function () {
  'use strict';
  var form = document.getElementById('form');
  var msg = document.getElementById('msg');
  var go = document.getElementById('go');

  form.onsubmit = function (e) {
    e.preventDefault();
    msg.classList.remove('on');
    go.disabled = true;
    go.textContent = 'Проверяем…';

    fetch('/api/admin/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      // кука сессии ставится ответом, поэтому запрос должен её принять
      credentials: 'same-origin',
      body: JSON.stringify({
        username: document.getElementById('u').value,
        password: document.getElementById('p').value
      })
    }).then(function (r) {
      return r.json().then(function (body) {
        if (!r.ok) throw new Error(body.detail || ('Ошибка ' + r.status));
        return body;
      });
    }).then(function () {
      location.href = '/admin';
    }).catch(function (err) {
      msg.textContent = err.message;
      msg.classList.add('on');
      document.getElementById('p').value = '';
      go.disabled = false;
      go.textContent = 'Войти';
    });
  };
})();
</script>
</body>
</html>
